name = "trask-worker"
workers_dev = true
main = "dist/worker.js"
compatibility_date = "2026-05-09"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "TraskAgent"
class_name = "TraskAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TraskAgent"]

[vars]
TRASK_WEB_ALLOW_ANONYMOUS = "1"
TRASK_BUILTIN_API = "0"
TRASK_BUILTIN_FALLBACK = "0"
# Set this to the public trask-retrieve Worker in production. Keep retrieval
# behind that Worker boundary rather than raw Chroma/indexer hosts.
TRASK_RETRIEVE_BASE_URL = "http://127.0.0.1:8787"
