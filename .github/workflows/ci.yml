name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild esbuild native binary
        run: pnpm rebuild esbuild

      - name: TypeScript build
        run: pnpm build

      - name: Trask offline gate (CI parity)
        run: pnpm trask:gate:ci
        env:
          TRASK_SKIP_BUILD: "1"

      - name: Lint (pazaak-world)
        run: pnpm --filter pazaak-world lint

      - name: Unit tests
        run: node --test packages/*/dist/*.test.js apps/*/dist/*.test.js

      - name: Install Playwright (Chromium)
        run: pnpm exec playwright install chromium --with-deps

      - name: Bootstrap Trask indexer venv
        run: bash scripts/bootstrap_trask_indexer.sh

      - name: Export Trask allowlist catalog
        run: node scripts/export_trask_allowlist_catalog.mjs

      - name: Trask indexer unit tests (Python)
        run: pnpm trask:indexer:test

      - name: Trask indexer drain-queue dry-run smoke
        run: .venv-trask-indexer/bin/python -m trask_indexer.cli drain-queue --dry-run

      - name: Seed Chroma golden fixtures for Holocron e2e
        run: .venv-trask-indexer/bin/python scripts/smoke_trask_indexed_stack.py --golden-fixtures --verify-retrieve
        env:
          TRASK_INDEXER_DATA_DIR: data/trask-indexer

      - name: Start Trask indexer (background)
        run: |
          .venv-trask-indexer/bin/trask-indexer serve &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8790/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Indexer failed to start" >&2
          exit 1

      - name: Start Trask retrieve Worker (background)
        run: |
          cd infra/trask-retrieve-worker
          TRASK_INDEXER_BASE_URL=http://127.0.0.1:8790 \
            pnpm exec wrangler dev --port 8787 --local-protocol http &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8787/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Retrieve Worker failed to start" >&2
          exit 1

      # Idempotent smoke: same path as local `pnpm trask:smoke:stack-bootstrap` (PR #69).
      - name: Trask QA stack bootstrap smoke
        run: pnpm trask:smoke:stack-bootstrap
        env:
          TRASK_INDEXER_BASE_URL: http://127.0.0.1:8787

      - name: Trask Discord verify import smoke (no token)
        run: pnpm verify:trask-discord:ci
        env:
          TRASK_INDEXER_BASE_URL: http://127.0.0.1:8787
          TRASK_SKIP_BUILD: "1"

      - name: Trask CLI verify import smoke (no LLM)
        run: pnpm verify:trask-cli:ci
        env:
          TRASK_INDEXER_BASE_URL: http://127.0.0.1:8787
          TRASK_SKIP_BUILD: "1"

      - name: Holocron e2e LLM config (optional repository secrets)
        run: |
          if [ -n "${OPENROUTER_API_KEY:-}" ] || [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "Holocron e2e: LLM compose enabled (OPENROUTER or OPENAI secret set)"
          else
            echo "::notice::Holocron e2e: no OPENROUTER_API_KEY or OPENAI_API_KEY — using retrieval + heuristic compose"
          fi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Playwright webServer: holocron-e2e-webserver.mjs (shared bootstrap for local parity).
      - name: Holocron functional e2e (live Trask research in browser)
        run: pnpm holocron:e2e:playwright
        env:
          TRASK_SKIP_BUILD: "1"
          TRASK_WEB_ALLOW_ANONYMOUS: "1"
          TRASK_INDEXER_BASE_URL: http://127.0.0.1:8787
          TRASK_WEB_RESEARCH_PYTHON: .venv-trask-indexer/bin/python
          TRASK_QA_GROUNDING: "1"
          TRASK_LLM_PROFILE: free
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_HTTP_REFERER: https://github.com/${{ github.repository }}
          OPENROUTER_APP_TITLE: OpenKotOR community-bots CI
