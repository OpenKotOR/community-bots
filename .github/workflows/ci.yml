name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild esbuild native binary
        run: pnpm rebuild esbuild

      - name: TypeScript build
        run: pnpm build

      - name: Trask offline gate (CI parity)
        run: pnpm trask:gate:ci
        env:
          TRASK_SKIP_BUILD: "1"

      - name: Lint (pazaak-world)
        run: pnpm --filter pazaak-world lint

      - name: Unit tests
        run: node --test packages/*/dist/*.test.js apps/*/dist/*.test.js

      - name: Bootstrap Trask indexer venv
        run: bash scripts/bootstrap_trask_indexer.sh

      - name: Export Trask allowlist catalog
        run: node scripts/export_trask_allowlist_catalog.mjs

      - name: Trask indexer unit tests (Python)
        run: pnpm trask:indexer:test

      - name: Trask indexer drain-queue dry-run smoke
        run: .venv-trask-indexer/bin/python -m trask_indexer.cli drain-queue --dry-run

      - name: Seed Chroma golden fixtures for Holocron e2e
        run: .venv-trask-indexer/bin/python scripts/smoke_trask_indexed_stack.py --golden-fixtures --verify-retrieve
        env:
          TRASK_INDEXER_DATA_DIR: data/trask-indexer

      - name: Start Trask indexer (background)
        run: |
          .venv-trask-indexer/bin/trask-indexer serve &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8790/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Indexer failed to start" >&2
          exit 1

      - name: Start Trask retrieve Worker (background)
        run: |
          cd infra/trask-retrieve-worker
          TRASK_INDEXER_BASE_URL=http://127.0.0.1:8790 \
            pnpm exec wrangler dev --port 8787 --local-protocol http &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8787/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Retrieve Worker failed to start" >&2
          exit 1

      # Idempotent smoke: same path as local `pnpm trask:smoke:stack-bootstrap` (PR #69).
      - name: Trask QA stack bootstrap smoke
        run: pnpm trask:smoke:stack-bootstrap
        env:
          TRASK_INDEXER_BASE_URL: http://127.0.0.1:8787

      - name: Trask offline gate (smoke + config drift + measure)
        run: pnpm trask:gate:ci
