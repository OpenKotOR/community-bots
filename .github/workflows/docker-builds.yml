name: Docker Builds CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "apps/**/Dockerfile"
      - "apps/**/package.json"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "infra/trask-http-public/**"
      - "scripts/bootstrap_trask_indexer.sh"
      - "scripts/trask_index_seed_for_qa.sh"
      - "scripts/smoke_trask_indexed_stack.py"
      - "scripts/export_trask_allowlist_catalog.mjs"
      - "scripts/pack-trask-http-hf-context.sh"
      - "scripts/verify_trask_http_hf_pack.mjs"
      - "data/trask/**"
      - ".github/workflows/docker-builds.yml"
      - ".dockerignore"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**/Dockerfile"
      - "apps/**/package.json"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "infra/trask-http-public/**"
      - "scripts/bootstrap_trask_indexer.sh"
      - "scripts/trask_index_seed_for_qa.sh"
      - "scripts/smoke_trask_indexed_stack.py"
      - "scripts/export_trask_allowlist_catalog.mjs"
      - "scripts/pack-trask-http-hf-context.sh"
      - "scripts/verify_trask_http_hf_pack.mjs"
      - "data/trask/**"
      - ".github/workflows/docker-builds.yml"
      - ".dockerignore"
  workflow_dispatch:

jobs:
  docker-builds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Match ci.yml: default GITHUB_TOKEN clones org submodules. A stale
          # ACTIONS_SUBMODULES_TOKEN secret breaks checkout when passed explicitly.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space for image builds
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker system prune -af --volumes || true
          df -h

      - name: Build and verify service images
        run: |
          set -euo pipefail

          declare -A SERVICE_DOCKERFILES=(
            [pazaak-bot]="apps/pazaak-bot/Dockerfile"
            [trask-bot]="apps/trask-bot/Dockerfile"
            [hk-bot]="apps/hk-bot/Dockerfile"
            [trask-http-server]="apps/trask-http-server/Dockerfile"
            [ingest-worker]="apps/ingest-worker/Dockerfile"
          )

          for service in "${!SERVICE_DOCKERFILES[@]}"; do
            image="${service}-service:test"
            dockerfile="${SERVICE_DOCKERFILES[$service]}"
            echo "Building $service with $dockerfile"
            docker buildx build --load --progress=plain -f "$dockerfile" -t "$image" .
            docker image inspect "$image" >/dev/null
            echo "OK: $service image built"
          done

      - name: Build and smoke test web images
        run: |
          set -euo pipefail

          declare -A WEB_DOCKERFILES=(
            [pazaak-world]="apps/pazaak-world/Dockerfile"
            [holocron-web]="apps/holocron-web/Dockerfile"
            [hk86-web]="apps/hk86-web/Dockerfile"
          )

          declare -A WEB_PORTS=(
            [pazaak-world]=5173
            [holocron-web]=5174
            [hk86-web]=5175
          )

          for app in pazaak-world holocron-web hk86-web; do
            image="${app}-preview:test"
            dockerfile="${WEB_DOCKERFILES[$app]}"
            port="${WEB_PORTS[$app]}"
            container="${app}-ci-test"

            echo "Building $app with $dockerfile"
            docker buildx build --load --progress=plain -f "$dockerfile" -t "$image" .
            docker image inspect "$image" >/dev/null

            echo "Smoke testing $app on port $port"
            docker run --rm -d --name "$container" -e PORT="$port" -p "$port:$port" "$image"
            sleep 5
            if docker logs "$container" | grep -E "Local:|Network:|listening|started|ready" >/dev/null; then
              echo "OK: $app started successfully"
            else
              echo "ERROR: $app did not show expected startup output"
              docker logs "$container" || true
              docker kill "$container" || true
              exit 1
            fi
            docker kill "$container" || true
          done

      - name: Build and verify Nakama module image
        run: |
          set -euo pipefail

          image="pazaak-nakama-builder:test"
          docker buildx build --load --progress=plain -f apps/pazaak-nakama/Dockerfile -t "$image" .
          docker image inspect "$image" >/dev/null
          docker run --rm "$image" ls -lh /app/dist
          echo "OK: Nakama module bundle verified"

      - name: Verify Trask HTTP HF pack
        run: node scripts/verify_trask_http_hf_pack.mjs

      - name: Build and smoke test Trask HTTP public (HF Space)
        run: |
          set -euo pipefail
          docker system prune -af || true
          df -h
          PACK_DIR="$(scripts/pack-trask-http-hf-context.sh)"
          node scripts/verify_trask_http_hf_pack.mjs
          image="trask-http-public:test"
          container="trask-http-public-ci"
          docker buildx build --load --progress=plain -f "$PACK_DIR/Dockerfile" -t "$image" "$PACK_DIR"
          docker image inspect "$image" >/dev/null
          docker run --rm -d --name "$container" -e PORT=7860 -p 7860:7860 "$image"
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:7860/ >/dev/null \
              && docker exec "$container" curl -sf http://127.0.0.1:8790/health >/dev/null; then
              echo "OK: trask-http-public HTTP + indexer healthy"
              docker kill "$container" || true
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: trask-http-public smoke test timed out"
          docker logs "$container" || true
          docker kill "$container" || true
          exit 1

      - name: CI summary
        run: echo "All Docker build and smoke tests passed"
