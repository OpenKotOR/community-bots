name: Deploy Trask HTTP (Hugging Face)

on:
  push:
    branches:
      - main
    paths:
      - "apps/trask-http-server/**"
      - "apps/holocron-web/**"
      - "packages/trask/**"
      - "packages/trask-http/**"
      - "packages/config/**"
      - "packages/retrieval/**"
      - "packages/persistence/**"
      - "packages/platform/**"
      - "packages/core/**"
      - "infra/trask-indexer/**"
      - "scripts/trask_web_research.py"
      - "scripts/bootstrap_trask_research.sh"
      - "scripts/bootstrap_trask_indexer.sh"
      - "scripts/trask_index_seed_for_qa.sh"
      - "scripts/smoke_trask_indexed_stack.py"
      - "scripts/export_trask_allowlist_catalog.mjs"
      - "data/trask/**"
      - "vendor/llm_fallbacks/**"
      - "data/ingest-worker/**"
      - "infra/trask-http-public/**"
      - "scripts/pack-trask-http-hf-context.sh"
      - "scripts/verify_trask_http_hf_pack.mjs"
      - "scripts/sync_hf_space_secrets.py"
      - "pnpm-lock.yaml"
      - ".github/workflows/trask-http-public.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trask-http-public
  cancel-in-progress: true

env:
  HF_SPACE_ID: OpenKotOR/holocron-trask-http

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Hugging Face deploy inputs
        id: hf_check
        shell: bash
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          if [ -z "$HUGGINGFACE_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping HF deploy. Set repository secret HUGGINGFACE_TOKEN."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.hf_check.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure HF Space exists
        if: steps.hf_check.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          pip install -q "huggingface_hub[cli]"
          hf repo create "${HF_SPACE_ID}" --repo-type space --space-sdk docker --exist-ok

      - name: Sync HF Space secrets and variables (optional LLM keys)
        if: steps.hf_check.outputs.configured == 'true'
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
        run: |
          pip install -q huggingface_hub
          python3 scripts/sync_hf_space_secrets.py "${HF_SPACE_ID}"

      - name: Verify HF Space pack
        if: steps.hf_check.outputs.configured == 'true'
        run: |
          chmod +x scripts/pack-trask-http-hf-context.sh
          node scripts/verify_trask_http_hf_pack.mjs

      - name: Pack and upload Space context
        if: steps.hf_check.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          pip install -q "huggingface_hub[cli]"
          chmod +x scripts/pack-trask-http-hf-context.sh
          PACK_DIR="$(scripts/pack-trask-http-hf-context.sh)"
          hf upload "${HF_SPACE_ID}" "$PACK_DIR/" --repo-type space \
            --delete "*" \
            --commit-message "Deploy trask-http from community-bots@${{ github.sha }}"

      - name: Wait for Space build
        if: steps.hf_check.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HF_SPACE_ID: ${{ env.HF_SPACE_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.error
          import urllib.request
          import time

          def print_space_logs(repo_id: str, token: str, log_type: str) -> None:
              url = f"https://huggingface.co/api/spaces/{repo_id}/logs/{log_type}?tail=160"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      body = res.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as err:
                  body = err.read().decode("utf-8", errors="replace")
                  print(f"--- HF {log_type} logs unavailable: HTTP {err.code} ---")
                  print(body[:4000])
                  return
              except Exception as err:
                  print(f"--- HF {log_type} logs unavailable: {err} ---")
                  return
              print(f"--- HF {log_type} logs tail ---")
              print(body[-12000:])

          def read_space_runtime(repo_id: str, token: str) -> tuple[str | None, str | None, str | None]:
              url = f"https://huggingface.co/api/spaces/{repo_id}?expand=runtime"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=20) as res:
                  data = json.loads(res.read().decode("utf-8", errors="replace"))
              runtime = data.get("runtime") or {}
              return runtime.get("stage"), runtime.get("message"), data.get("subdomain")

          repo_id = os.environ["HF_SPACE_ID"]
          token = os.environ.get("HF_TOKEN", "")
          for attempt in range(60):
              stage, msg, subdomain = read_space_runtime(repo_id, token)
              print(f"attempt {attempt}: stage={stage}")
              if stage == "RUNNING":
                  if subdomain:
                      print(f"Space running: https://{subdomain}.hf.space")
                  else:
                      print(f"Space running: https://{repo_id.split('/')[-1]}.hf.space")
                  break
              if stage in ("ERROR", "CONFIG_ERROR", "BUILD_ERROR", "RUNTIME_ERROR"):
                  if token:
                      print_space_logs(repo_id, token, "build")
                      print_space_logs(repo_id, token, "run")
                  raise SystemExit(f"HF Space failed: stage={stage} message={msg}")
              time.sleep(30)
          else:
              raise SystemExit("Timed out waiting for HF Space")
          PY
